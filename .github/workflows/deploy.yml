name: Laravel Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    environment: deploy
    runs-on: ubuntu-latest

    steps:
    - name: Check required secrets
      run: |
        errors=0
        if [ -z "${{ secrets.VPS_HOST }}" ]; then echo "ERROR: VPS_HOST secret is missing"; errors=1; fi
        if [ -z "${{ secrets.VPS_USER }}" ]; then echo "ERROR: VPS_USER secret is missing"; errors=1; fi
        if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then echo "ERROR: VPS_SSH_KEY secret is missing"; errors=1; fi
        if [ -z "${{ secrets.VPS_PORT }}" ]; then echo "ERROR: VPS_PORT secret is missing"; errors=1; fi
        if [ $errors -ne 0 ]; then echo "One or more secrets are missing. See above."; exit 1; fi
        echo "All required secrets present (values not shown)."

    - name: Test SSH connectivity
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        envs: GITHUB_PAT,GIT_USER_NAME,GIT_USER_EMAIL
        script: |
          echo "SSH connection successful."
          export DRONE_SSH_KEY="-----BEGIN OPENSSH PRIVATE KEY-----\\n-----END OPENSSH PRIVATE KEY-----"
          whoami
          hostname
          ls -la /var/www/legal-war-machine/war-machine

    - name: Deploy to VPS via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          set -e
          echo "Deploy to VPS started."
          export DRONE_SSH_KEY="-----BEGIN OPENSSH PRIVATE KEY-----\\n-----END OPENSSH PRIVATE KEY-----"
          whoami
          hostname
          cd /var/www/legal-war-machine/war-machine
          git config user.name "aglavas"
          git remote set-url origin https://x-access-token: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@github.com/aglavas/ai-legal-war-machine

          git fetch --all
          git reset --hard origin/master

          mkdir -p storage/app/public \
           storage/framework/cache/data \
           storage/framework/sessions \
           storage/framework/views \
           storage/logs \
           bootstrap/cache

          sudo chown -R deploy:web storage bootstrap/cache
          sudo find storage bootstrap/cache -type d -exec chmod 2775 {} \;
          sudo find storage bootstrap/cache -type f -exec chmod 664 {} \;

          php artisan config:clear
          php artisan optimize:clear
          php artisan cache:clear
          php artisan view:clear
          php artisan migrate --force
          npm install
          npm run build
          php artisan optimize
          sudo supervisorctl restart all
          php artisan queue:restart


          echo "Checking for migration state mismatch..."
          php artisan tinker --execute="
            // Define table-to-migration mapping (all critical tables)
            \$tableToMigration = [
              'cases_documents_uploads' => '2025_10_05_000010_create_cases_documents_uploads_table',
              'cases_documents' => '2025_10_05_000020_create_cases_documents_table',
              'laws' => '2025_10_05_000100_create_laws_table',
              'court_decisions' => '2025_10_17_000000_create_court_decisions_table',
              'court_decision_documents' => '2025_10_17_000020_create_court_decision_documents_table',
            ];

            \$missingTables = [];
            \$migrationsToRemove = [];
            \$migrationsToAdd = [];

            // Get current max batch number
            \$maxBatch = DB::table('migrations')->max('batch') ?? 0;

            foreach (\$tableToMigration as \$table => \$migration) {
              \$tableExists = Schema::hasTable(\$table);
              \$migrationExists = DB::table('migrations')->where('migration', \$migration)->exists();

              if (!\$tableExists && \$migrationExists) {
                // Table missing but migration record exists - remove stale record
                \$missingTables[] = \$table;
                \$migrationsToRemove[] = \$migration;
              } elseif (\$tableExists && !\$migrationExists) {
                // Table exists but migration record missing - add record to prevent re-creation
                \$migrationsToAdd[] = \$migration;
              }
            }

            if (!empty(\$migrationsToRemove)) {
              echo 'Tables missing, removing stale migration records: ' . implode(', ', \$missingTables) . PHP_EOL;
              foreach (\$migrationsToRemove as \$migration) {
                \$deleted = DB::table('migrations')->where('migration', \$migration)->delete();
                echo \"  Removed: \$migration\" . PHP_EOL;
              }
            }

            if (!empty(\$migrationsToAdd)) {
              echo 'Tables exist but missing migration records, adding: ' . implode(', ', \$migrationsToAdd) . PHP_EOL;
              foreach (\$migrationsToAdd as \$migration) {
                DB::table('migrations')->insert(['migration' => \$migration, 'batch' => \$maxBatch + 1]);
                echo \"  Added: \$migration\" . PHP_EOL;
              }
            }

            if (empty(\$migrationsToRemove) && empty(\$migrationsToAdd)) {
              echo 'Migration state is consistent with database tables.' . PHP_EOL;
            }
          "
