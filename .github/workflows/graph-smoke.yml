name: Graph Database Smoke Tests

on:
  pull_request:
    paths:
      - 'app/Services/GraphDatabaseService.php'
      - 'app/Services/GraphQueryHelper.php'
      - 'app/Services/Odluke/OdlukeIngestService.php'
      - 'app/Console/Commands/GraphSmokeTestCommand.php'
      - 'tests/Fixtures/odluke/**'
      - 'config/neo4j.php'
      - '.github/workflows/graph-smoke.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/Services/GraphDatabaseService.php'
      - 'app/Services/GraphQueryHelper.php'
      - 'app/Services/Odluke/OdlukeIngestService.php'
      - 'app/Console/Commands/GraphSmokeTestCommand.php'
      - 'tests/Fixtures/odluke/**'
      - 'config/neo4j.php'
  workflow_dispatch:

jobs:
  smoke-test:
    name: Neo4j Graph Smoke Test
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_ACCEPT_LICENSE_AGREEMENT: 'yes'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env.testing
        run: |
          cp .env.testing .env
          php artisan key:generate

      - name: Configure Neo4j connection
        run: |
          echo "NEO4J_ENABLED=true" >> .env
          echo "NEO4J_URI=bolt://localhost:7687" >> .env
          echo "NEO4J_USERNAME=neo4j" >> .env
          echo "NEO4J_PASSWORD=testpassword" >> .env
          echo "NEO4J_DATABASE=neo4j" >> .env
          echo "ODLUKE_SYNC_GRAPH=true" >> .env

      - name: Configure PostgreSQL connection
        run: |
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=localhost" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=testing" >> .env
          echo "DB_USERNAME=testing" >> .env
          echo "DB_PASSWORD=testing" >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Wait for Neo4j to be ready
        run: |
          for i in {1..30}; do
            if cypher-shell -u neo4j -p testpassword -a bolt://localhost:7687 "RETURN 1" >/dev/null 2>&1; then
              echo "Neo4j is ready!"
              break
            fi
            echo "Waiting for Neo4j... ($i/30)"
            sleep 2
          done

      - name: Initialize Neo4j schema
        run: php artisan graph:init --force

      - name: Run Graph Smoke Tests
        run: php artisan graph:smoke-test --cleanup --verbose

      - name: Display Neo4j logs on failure
        if: failure()
        run: docker logs $(docker ps -q --filter ancestor=neo4j:5.15) || echo "No Neo4j container logs available"

      - name: Check Neo4j connectivity on failure
        if: failure()
        run: |
          echo "Checking Neo4j connectivity..."
          cypher-shell -u neo4j -p testpassword -a bolt://localhost:7687 "RETURN 1" || echo "Cannot connect to Neo4j"

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: smoke-test
    if: always()
    steps:
      - name: Generate summary
        run: |
          if [ "${{ needs.smoke-test.result }}" == "success" ]; then
            echo "✅ Graph smoke tests passed successfully!"
            echo "### ✅ Graph Smoke Tests - PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All graph database integration tests completed successfully." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Verified:**" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Neo4j connectivity" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Database row creation" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Graph node storage" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ Query verification" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Graph smoke tests failed!"
            echo "### ❌ Graph Smoke Tests - FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Graph database integration tests encountered errors. Please review the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
