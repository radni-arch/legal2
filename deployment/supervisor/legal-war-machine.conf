; ============================================
; AI Legal War Machine - Supervisor Configuration
; ============================================
;
; Path: /etc/supervisor/conf.d/legal-war-machine.conf
; Project: /var/www/legal-war-machine/war-machine
;
; Installation:
;   sudo cp deployment/supervisor/legal-war-machine.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread
;   sudo supervisorctl update
;
; Prerequisites:
;   - Redis server running (recommended for production)
;   - Set QUEUE_CONNECTION=redis in .env
;   - Log directory exists with correct permissions
;
; ============================================

; --------------------------------------------
; Queue Workers - High Priority
; --------------------------------------------
; Critical jobs that need immediate processing
; Dedicated workers ensure high-priority jobs never wait

[program:legal-war-machine-worker-high]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/legal-war-machine/war-machine/artisan queue:work redis --queue=high --sleep=1 --tries=3 --max-time=3600 --max-jobs=500 --memory=256 --rest=0.5
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/legal-war-machine/war-machine/storage/logs/worker-high.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stopwaitsecs=30
startsecs=5
priority=100

; --------------------------------------------
; Queue Workers - Default Queue
; --------------------------------------------
; Standard background jobs

[program:legal-war-machine-worker-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/legal-war-machine/war-machine/artisan queue:work redis --queue=default,low --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000 --memory=256 --rest=0.5 --backoff=3,10,30
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/legal-war-machine/war-machine/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stopwaitsecs=30
startsecs=5
priority=200

; --------------------------------------------
; Queue Workers - Agent Queue
; --------------------------------------------
; AI agent jobs - longer running, higher memory
; Isolated workers prevent agent jobs from blocking other queues

[program:legal-war-machine-worker-agents]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/legal-war-machine/war-machine/artisan queue:work redis --queue=agents --sleep=3 --tries=3 --max-time=7200 --max-jobs=100 --memory=1024 --timeout=1800 --rest=1 --backoff=10,30,60
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/legal-war-machine/war-machine/storage/logs/worker-agents.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=120
startsecs=5
priority=300

; --------------------------------------------
; Queue Workers - Textract Queue
; --------------------------------------------
; OCR/document processing - CPU intensive, long running
; Single processor to avoid overwhelming Textract API limits

[program:legal-war-machine-worker-textract]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/legal-war-machine/war-machine/artisan queue:work redis --queue=textract --sleep=5 --tries=5 --max-time=7200 --max-jobs=50 --memory=1024 --timeout=1800 --rest=2 --backoff=30,60,120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/legal-war-machine/war-machine/storage/logs/worker-textract.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=10
stopwaitsecs=180
startsecs=5
priority=400

; --------------------------------------------
; Laravel Reverb (WebSocket Server)
; --------------------------------------------
; Real-time broadcasting for live updates

[program:legal-war-machine-reverb]
process_name=%(program_name)s
command=php /var/www/legal-war-machine/war-machine/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/legal-war-machine/war-machine/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=10
startsecs=5
priority=50

; --------------------------------------------
; Laravel Scheduler
; --------------------------------------------
; Runs scheduled tasks every minute

[program:legal-war-machine-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do php /var/www/legal-war-machine/war-machine/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/legal-war-machine/war-machine/storage/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stopwaitsecs=10
startsecs=5
priority=500

; --------------------------------------------
; Process Groups
; --------------------------------------------

[group:legal-war-machine]
programs=legal-war-machine-worker-high,legal-war-machine-worker-default,legal-war-machine-worker-agents,legal-war-machine-worker-textract,legal-war-machine-reverb,legal-war-machine-scheduler
priority=999

; ============================================
; Configuration Summary
; ============================================
;
; Queue        | Workers | Memory  | Timeout | Max Jobs | Sleep | Backoff
; -------------|---------|---------|---------|----------|-------|--------
; high         | 2       | 256MB   | default | 500      | 1s    | default
; default,low  | 4       | 256MB   | default | 1000     | 3s    | 3,10,30s
; agents       | 4       | 1024MB  | 30min   | 100      | 3s    | 10,30,60s
; textract     | 2       | 1024MB  | 30min   | 50       | 5s    | 30,60,120s
;
; Total workers: 12 + 1 reverb + 1 scheduler = 14 processes
;
; ============================================
; Usage Commands
; ============================================
;
; Start all:
;   sudo supervisorctl start legal-war-machine:*
;
; Stop all:
;   sudo supervisorctl stop legal-war-machine:*
;
; Restart all:
;   sudo supervisorctl restart legal-war-machine:*
;
; Status:
;   sudo supervisorctl status legal-war-machine:*
;
; Reload config:
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Graceful restart (for deployments):
;   php /var/www/legal-war-machine/war-machine/artisan queue:restart
;
; Monitor specific queue:
;   sudo supervisorctl status legal-war-machine:legal-war-machine-worker-agents*
;
; ============================================
; Scaling Guide
; ============================================
;
; Low traffic:   high=1, default=2, agents=2, textract=1 (6 workers)
; Medium:        high=2, default=4, agents=4, textract=2 (12 workers) [current]
; High traffic:  high=4, default=8, agents=6, textract=4 (22 workers)
;
; Rule of thumb: 1 worker per CPU core for CPU-bound (agents, textract)
;                2-4 workers per core for I/O-bound (default, high)
;
; ============================================
