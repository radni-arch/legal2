# ============================================
# Neo4j Configuration for Production
# AI Legal War Machine - Knowledge Graph Database
# ============================================
#
# VPS Specs: 16GB RAM, 4 CPU cores, SSD
# Neo4j Usage: Legal knowledge graph (laws, cases, decisions)
# Expected Data: < 100k nodes, < 500k relationships
#
# Installation Location: /etc/neo4j/neo4j.conf
# After editing, restart: sudo systemctl restart neo4j
#
# ============================================

# --------------------------------------------
# MEMORY CONFIGURATION
# --------------------------------------------

# Initial heap size (2GB)
server.memory.heap.initial_size=2g

# Maximum heap size (4GB)
# Recommended: 25% of total RAM for heap on dedicated server
# For shared server (with PostgreSQL, Redis): 2-4GB is appropriate
server.memory.heap.max_size=4g

# Page cache size (8GB)
# Recommended: 50% of remaining RAM after heap
# Page cache stores nodes, relationships, and properties
# Larger page cache = better query performance
server.memory.pagecache.size=8g

# --------------------------------------------
# NETWORK CONFIGURATION
# --------------------------------------------

# Bolt connector (binary protocol)
server.bolt.enabled=true
server.bolt.listen_address=0.0.0.0:7687

# HTTP connector (REST API)
server.http.enabled=true
server.http.listen_address=0.0.0.0:7474

# HTTPS connector (optional)
# server.https.enabled=true
# server.https.listen_address=0.0.0.0:7473

# --------------------------------------------
# SECURITY
# --------------------------------------------

# Authentication enabled
dbms.security.auth_enabled=true

# Default database
initial.dbms.default_database=neo4j

# Allow file uploads (for CSV import)
dbms.security.allow_csv_import_from_file_urls=true

# Transaction timeout (5 minutes)
db.transaction.timeout=300s

# Lock acquisition timeout (2 minutes)
db.lock.acquisition.timeout=120s

# --------------------------------------------
# PERFORMANCE TUNING
# --------------------------------------------

# Query timeout (5 minutes for complex graph queries)
db.transaction.timeout=300s

# Checkpoint interval (15 minutes)
# More frequent checkpoints = less recovery time but more I/O
db.checkpoint.interval.time=15m

# Checkpoint transaction threshold
# Trigger checkpoint after N transactions
db.checkpoint.interval.tx=100000

# --------------------------------------------
# QUERY LOGGING
# --------------------------------------------

# Log queries slower than 10 seconds
db.logs.query.enabled=INFO
db.logs.query.threshold=10s
db.logs.query.parameter_logging_enabled=true

# Query log rotation
db.logs.query.rotation.keep_number=7
db.logs.query.rotation.size=20m

# --------------------------------------------
# CONNECTION POOLING
# --------------------------------------------

# Maximum number of threads
server.threads.worker_count=4

# Bolt thread pool
server.bolt.thread_pool_min_size=5
server.bolt.thread_pool_max_size=400
server.bolt.thread_pool_keep_alive=5m

# Connection timeout
dbms.connector.bolt.connection_keep_alive=1h

# --------------------------------------------
# CYPHER QUERY CACHE
# --------------------------------------------

# Query cache size (number of queries to cache)
db.query_cache_size=1000

# --------------------------------------------
# INDEX CONFIGURATION
# --------------------------------------------

# Index sampling
db.index.default.sampling.update_percentage=5
db.index.default.sampling.update_interval=2m

# --------------------------------------------
# STORE FILES
# --------------------------------------------

# Data directory
# dbms.directories.data=/var/lib/neo4j/data

# Import directory (for CSV imports)
# dbms.directories.import=/var/lib/neo4j/import

# Logs directory
# dbms.directories.logs=/var/log/neo4j

# --------------------------------------------
# TRANSACTION LOG
# --------------------------------------------

# Keep transaction logs for 7 days
db.tx_log.rotation.retention_policy=7 days

# Rotate transaction log after 1GB
db.tx_log.rotation.size=1G

# --------------------------------------------
# METRICS AND MONITORING
# --------------------------------------------

# Enable metrics
metrics.enabled=true

# CSV metrics output
metrics.csv.enabled=true
metrics.csv.interval=30s
metrics.csv.rotation.keep_number=10
metrics.csv.rotation.size=10m

# JMX monitoring (optional)
# metrics.jmx.enabled=true

# --------------------------------------------
# BACKUP CONFIGURATION
# --------------------------------------------

# Online backup port (optional)
# dbms.backup.enabled=true
# dbms.backup.address=0.0.0.0:6362

# --------------------------------------------
# CLUSTERING (Optional - for future)
# --------------------------------------------

# Clustering mode (disabled for single-server setup)
# dbms.mode=SINGLE

# For clustered setup:
# dbms.mode=CORE
# causal_clustering.minimum_core_cluster_size_at_formation=3
# causal_clustering.minimum_core_cluster_size_at_runtime=3
# causal_clustering.initial_discovery_members=server1:5000,server2:5000,server3:5000

# --------------------------------------------
# JAVA SETTINGS
# --------------------------------------------

# Java options (in jvm.conf, not here)
# -XX:+UseG1GC
# -XX:+AlwaysPreTouch
# -XX:+UnlockExperimentalVMOptions
# -XX:+TrustFinalNonStaticFields
# -XX:+DisableExplicitGC
# -Djdk.nio.maxCachedBufferSize=262144
# -Dio.netty.tryReflectionSetAccessible=true
# -Djdk.tls.ephemeralDHKeySize=2048
# -Djdk.tls.rejectClientInitiatedRenegotiation=true

# --------------------------------------------
# NOTES
# --------------------------------------------
#
# After changing this configuration:
# 1. Validate syntax: neo4j-admin check-config
# 2. Restart Neo4j: sudo systemctl restart neo4j
# 3. Check status: sudo systemctl status neo4j
# 4. Check logs: sudo tail -f /var/log/neo4j/neo4j.log
# 5. Monitor performance: neo4j-admin memrec
#
# Memory Recommendations:
# - Heap: 25% of RAM (max 32GB)
# - Page Cache: 50% of remaining RAM
# - OS Cache: 25% of RAM
#
# For 16GB RAM:
# - Heap: 4GB
# - Page Cache: 8GB
# - OS Cache: 4GB
#
# Performance Tips:
# - Use PROFILE to analyze slow queries
# - Create indexes on frequently queried properties
# - Use EXPLAIN to understand query plans
# - Monitor page cache hit ratio (should be > 90%)
#
# ============================================
