# ============================================
# PostgreSQL Configuration for Production
# AI Legal War Machine
# ============================================
#
# VPS Specs: 16GB RAM, 4 CPU cores, SSD
# Database Size: Small to medium (< 10GB expected)
# Workload: Mixed OLTP + Analytics
#
# Installation Location: /etc/postgresql/14/main/postgresql.conf
# After editing, reload: sudo systemctl reload postgresql
#
# ============================================

# --------------------------------------------
# MEMORY CONFIGURATION
# --------------------------------------------

# Shared Buffers: 25% of RAM for dedicated database server
# This is the PostgreSQL cache - crucial for performance
shared_buffers = 4GB

# Effective Cache Size: 75% of RAM
# Tells optimizer how much memory is available for caching
# (This is not allocated, just hints to query planner)
effective_cache_size = 12GB

# Maintenance Work Memory: For VACUUM, CREATE INDEX, etc.
maintenance_work_mem = 1GB

# Work Memory: Per-operation memory (sorts, hash joins)
# 64MB is safe for 4GB shared_buffers
# Be careful: multiple operations can use this simultaneously
work_mem = 64MB

# --------------------------------------------
# QUERY PLANNER
# --------------------------------------------

# Random Page Cost: SSD optimization
# Default is 4.0 (HDD), set to 1.1 for SSD
# Encourages index scans over sequential scans on SSD
random_page_cost = 1.1

# Effective IO Concurrency: SSD can handle many concurrent I/O
# Default is 1 (HDD), set to 200 for SSD
effective_io_concurrency = 200

# --------------------------------------------
# WRITE-AHEAD LOG (WAL)
# --------------------------------------------

# WAL Buffers: -1 = auto-tune (recommended)
wal_buffers = -1

# Checkpoint Completion Target: Spread checkpoints over time
# 0.9 = use 90% of checkpoint interval for writing
checkpoint_completion_target = 0.9

# Max WAL Size: Maximum size of WAL between checkpoints
# Larger = fewer checkpoints but longer recovery time
max_wal_size = 2GB

# Min WAL Size: Minimum size of WAL
min_wal_size = 1GB

# --------------------------------------------
# CONNECTIONS
# --------------------------------------------

# Max Connections: 100 is default, suitable for our VPS
# Each connection uses work_mem, so don't set too high
max_connections = 100

# --------------------------------------------
# AUTOVACUUM (Critical for Performance)
# --------------------------------------------

# Autovacuum: MUST be on for production
autovacuum = on

# Autovacuum Max Workers: Number of parallel workers
autovacuum_max_workers = 3

# Autovacuum Naptime: Time between autovacuum runs
autovacuum_naptime = 30s

# Autovacuum Vacuum Threshold: Minimum row updates before vacuum
autovacuum_vacuum_threshold = 50

# Autovacuum Vacuum Scale Factor: Fraction of table size
autovacuum_vacuum_scale_factor = 0.1

# Autovacuum Analyze Threshold: Minimum row changes before analyze
autovacuum_analyze_threshold = 50

# Autovacuum Analyze Scale Factor
autovacuum_analyze_scale_factor = 0.05

# --------------------------------------------
# LOGGING
# --------------------------------------------

# Log Destination: Where to log
log_destination = 'stderr'

# Logging Collector: Enable log file rotation
logging_collector = on

# Log Directory
log_directory = 'log'

# Log Filename Pattern: One log file per day
log_filename = 'postgresql-%Y-%m-%d.log'

# Log Rotation: Daily
log_rotation_age = 1d

# Log Rotation Size: 100MB max per file
log_rotation_size = 100MB

# Log Line Prefix: Include timestamp, user, database, PID
log_line_prefix = '%t [%p] %u@%d '

# Log Timezone
log_timezone = 'UTC'

# --------------------------------------------
# SLOW QUERY LOGGING
# --------------------------------------------

# Log slow queries for performance monitoring
log_min_duration_statement = 1000  # Log queries taking > 1 second

# Log Checkpoints: Monitor checkpoint performance
log_checkpoints = on

# Log Connections: Security monitoring
log_connections = on

# Log Disconnections: Security monitoring
log_disconnections = on

# Log Lock Waits: Debug contention issues
log_lock_waits = on

# Deadlock Timeout: How long to wait before checking for deadlock
deadlock_timeout = 1s

# --------------------------------------------
# LOCALE AND FORMATTING
# --------------------------------------------

# Timezone
timezone = 'UTC'

# Date Style
datestyle = 'iso, mdy'

# Locale (using C for performance, change if needed)
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Default Text Search Config
default_text_search_config = 'pg_catalog.english'

# --------------------------------------------
# EXTENSIONS
# --------------------------------------------

# Shared Preload Libraries: Load extensions at server start
# pgvector for vector similarity search (if installed)
shared_preload_libraries = 'pg_stat_statements'

# --------------------------------------------
# STATISTICS
# --------------------------------------------

# Track Activity Query Size: Longer queries visible in pg_stat_activity
track_activity_query_size = 2048

# Track IO Timing: Measure I/O time (useful for SSD)
track_io_timing = on

# Track Functions: Track function call statistics
track_functions = pl

# Track Counts: Essential for query planner
track_counts = on

# --------------------------------------------
# CLIENT CONNECTION DEFAULTS
# --------------------------------------------

# Statement Timeout: Kill queries running > 5 minutes
# Prevents runaway queries from blocking
statement_timeout = 300000  # 5 minutes in milliseconds

# Idle in Transaction Timeout: Kill idle transactions
idle_in_transaction_session_timeout = 600000  # 10 minutes

# --------------------------------------------
# REPLICATION (Optional - for future)
# --------------------------------------------

# WAL Level: minimal | replica | logical
# Use 'replica' if planning streaming replication
# wal_level = replica

# Max WAL Senders: Number of replication connections
# max_wal_senders = 3

# WAL Keep Size: How much WAL to keep for standbys
# wal_keep_size = 1GB

# --------------------------------------------
# PERFORMANCE MONITORING
# --------------------------------------------

# pg_stat_statements: Track query statistics
# (Requires shared_preload_libraries = 'pg_stat_statements')
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# --------------------------------------------
# NOTES
# --------------------------------------------
#
# After changing this configuration:
# 1. Validate syntax: postgres -c config_file=/etc/postgresql/14/main/postgresql.conf -C shared_buffers
# 2. Reload config: sudo systemctl reload postgresql
# 3. For some settings (like shared_buffers), restart is required: sudo systemctl restart postgresql
# 4. Check logs: sudo tail -f /var/log/postgresql/postgresql-*.log
# 5. Monitor performance: SELECT * FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;
#
# ============================================
