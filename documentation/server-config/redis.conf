# ============================================
# Redis Configuration for Production
# AI Legal War Machine
# ============================================
#
# VPS Specs: 16GB RAM, 4 CPU cores, SSD
# Redis Usage: Cache, Sessions, Queues, Broadcasting
# Expected Memory: 2-4GB total
#
# Installation Location: /etc/redis/redis.conf
# After editing, restart: sudo systemctl restart redis-server
#
# ============================================

# --------------------------------------------
# NETWORK
# --------------------------------------------

# Bind to localhost only (more secure)
# If you need external access, add your app server IP
bind 127.0.0.1

# Port
port 6379

# TCP listen() backlog
tcp-backlog 511

# Close connection after client idle for N seconds (0 = disable)
timeout 0

# TCP keepalive
tcp-keepalive 300

# --------------------------------------------
# GENERAL
# --------------------------------------------

# Run as daemon (yes for production)
daemonize yes

# PID file location
pidfile /var/run/redis/redis-server.pid

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file location
logfile /var/log/redis/redis-server.log

# Number of databases (we use 0-3 for different purposes)
# Database 0: Default/Cache
# Database 1: Sessions
# Database 2: Queues
# Database 3: Broadcasting
databases 16

# --------------------------------------------
# SNAPSHOTTING (RDB Persistence)
# --------------------------------------------

# Save the DB to disk
# save <seconds> <changes>
# Save after 900 sec (15 min) if at least 1 key changed
save 900 1
# Save after 300 sec (5 min) if at least 10 keys changed
save 300 10
# Save after 60 sec if at least 10000 keys changed
save 60 10000

# Stop accepting writes if RDB save fails (safety)
stop-writes-on-bgsave-error yes

# Compress string objects using LZF
rdbcompression yes

# Checksum RDB files
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory (where RDB/AOF files are written)
dir /var/lib/redis

# --------------------------------------------
# REPLICATION (Optional - for future)
# --------------------------------------------

# Replica read-only mode
replica-read-only yes

# --------------------------------------------
# SECURITY
# --------------------------------------------

# Require password for authentication
# CHANGE THIS IN PRODUCTION!
# Generate with: openssl rand -base64 32
# requirepass your-strong-password-here

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG-PROTECTED-COMMAND"

# --------------------------------------------
# MEMORY MANAGEMENT
# --------------------------------------------

# Max memory limit (4GB for production)
# Adjust based on your VPS RAM availability
maxmemory 4gb

# Eviction policy when max memory is reached
# Options:
# - volatile-lru: Remove keys with expire set using LRU
# - allkeys-lru: Remove any key using LRU
# - volatile-lfu: Remove keys with expire set using LFU
# - allkeys-lfu: Remove any key using LFU
# - volatile-random: Remove random key with expire set
# - allkeys-random: Remove random key
# - volatile-ttl: Remove key with nearest expire time
# - noeviction: Return error when memory limit is reached
#
# For cache: allkeys-lru (remove least recently used)
# For sessions: volatile-lru (only remove expired sessions)
maxmemory-policy allkeys-lru

# LRU/LFU sample size (higher = more accurate but slower)
maxmemory-samples 5

# --------------------------------------------
# APPEND-ONLY FILE (AOF Persistence)
# --------------------------------------------

# Enable AOF (more durable than RDB)
# For queue data: recommended
# For cache only: can be disabled
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# Fsync policy:
# - always: Fsync after every write (slow but safest)
# - everysec: Fsync every second (good compromise)
# - no: Let OS decide when to fsync (fast but risky)
appendfsync everysec

# Don't fsync during BGSAVE/BGREWRITEAOF
no-appendfsync-on-rewrite no

# Auto-rewrite AOF when it grows too large
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load truncated AOF on startup
aof-load-truncated yes

# Use RDB-AOF mixed format (faster loading)
aof-use-rdb-preamble yes

# --------------------------------------------
# SLOW LOG
# --------------------------------------------

# Log commands slower than X microseconds
# 10000 = 10ms
slowlog-log-slower-than 10000

# Maximum slow log entries
slowlog-max-len 128

# --------------------------------------------
# LATENCY MONITORING
# --------------------------------------------

# Latency monitoring threshold in milliseconds
latency-monitor-threshold 100

# --------------------------------------------
# EVENT NOTIFICATION (for cache invalidation)
# --------------------------------------------

# Enable keyspace notifications
# K: Keyspace events (publish __keyspace@<db>__:<key> <event>)
# E: Keyevent events (publish __keyevent@<db>__:<event> <key>)
# g: Generic commands (DEL, EXPIRE, RENAME, ...)
# $: String commands
# l: List commands
# s: Set commands
# h: Hash commands
# z: Sorted set commands
# x: Expired events
# e: Evicted events
# A: Alias for "g$lshzxe"
#
# Example: "KEA" = keyspace + keyevent + all events
notify-keyspace-events ""

# --------------------------------------------
# ADVANCED CONFIG
# --------------------------------------------

# Hash table rehashing
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List compression
list-max-ziplist-size -2
list-compress-depth 0

# Set encoding
set-max-intset-entries 512

# Sorted set encoding
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Streams macro node max entries
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
# client-output-buffer-limit <class> <hard limit> <soft limit> <soft seconds>
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency of active expiration cycle
hz 10

# Enable active defragmentation
activedefrag yes

# Minimum percentage of fragmentation to start active defrag
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10

# Maximum percentage of fragmentation to start active defrag
active-defrag-threshold-upper 100

# Minimal effort for defrag in CPU percentage
active-defrag-cycle-min 1

# Maximum effort for defrag in CPU percentage
active-defrag-cycle-max 25

# Maximum number of set/hash/zset/list fields that will be processed from
# the main dictionary scan
active-defrag-max-scan-fields 1000

# --------------------------------------------
# NOTES
# --------------------------------------------
#
# After changing this configuration:
# 1. Validate syntax: redis-server /etc/redis/redis.conf --test-memory 1024
# 2. Restart Redis: sudo systemctl restart redis-server
# 3. Check status: sudo systemctl status redis-server
# 4. Check logs: sudo tail -f /var/log/redis/redis-server.log
# 5. Monitor performance: redis-cli INFO
# 6. Monitor slow queries: redis-cli SLOWLOG GET 10
#
# Database Usage:
# - Database 0: Application cache (default)
# - Database 1: User sessions
# - Database 2: Job queues
# - Database 3: Broadcasting/WebSockets
#
# ============================================
