# ============================================
# Supervisor Configuration
# AI Legal War Machine - Queue Workers
# ============================================
#
# This configuration manages Laravel queue workers for production.
# Install location: /etc/supervisor/conf.d/ai-legal-war-machine.conf
#
# ============================================

# --------------------------------------------
# MAIN QUEUE WORKER (4 processes)
# --------------------------------------------
[program:ai-legal-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ai-legal-war-machine/artisan queue:work redis --queue=high,agents,textract,default,low --sleep=3 --tries=3 --max-time=3600 --timeout=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/www/ai-legal-war-machine/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

# --------------------------------------------
# CONFIGURATION NOTES
# --------------------------------------------
#
# Queue Priority Order:
# 1. high     - Critical operations (payment processing, user actions)
# 2. agents   - AI agent jobs (research, decision discovery)
# 3. textract - AWS Textract OCR processing
# 4. default  - Standard jobs
# 5. low      - Background maintenance, cleanup
#
# Parameters:
# --sleep=3           : Wait 3 seconds when queue is empty before checking again
# --tries=3           : Retry failed jobs up to 3 times
# --max-time=3600     : Worker restarts after 1 hour (prevents memory leaks)
# --timeout=300       : Job timeout: 5 minutes (kill if exceeds)
# --stopwaitsecs=3600 : Wait 1 hour for jobs to finish on graceful shutdown
#
# Security:
# - Runs as www-data user (same as PHP-FPM)
# - Limited to 4 processes (prevents resource exhaustion)
# - Automatic restart on failure
# - Graceful shutdown to prevent job loss
#
# Logging:
# - All output to storage/logs/queue-worker.log
# - Max 10MB per log file
# - Keep 5 backup files (50MB total)
#
# ============================================
