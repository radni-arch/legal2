openapi: 3.0.3
info:
  title: Croatian Legal AI War Machine API
  description: |
    Comprehensive API for Croatian legal system analysis, prosecutorial misconduct detection,
    and AI-powered legal research. This system provides advanced capabilities for:

    - Legal document search and retrieval (laws, court decisions, cases)
    - OpenAI API proxy with Croatian legal context
    - Prosecutorial misconduct detection and legal action generation
    - Multi-agent collaboration for complex legal problems
    - Predictive analytics for case outcomes
    - Graph-based citation analysis
    - MCP (Model Context Protocol) tools integration

    ## Authentication

    Most endpoints require API token authentication via the `Authorization: Bearer <token>` header.
    Some endpoints use `X-MCP-Token` header for MCP-specific authentication.

    ## Rate Limiting

    - Standard endpoints: 60 requests per minute
    - MCP endpoints: Tool-specific limits
    - Info endpoints: 60 requests per minute

    ## Croatian Legal Context

    This API is specifically designed for the Croatian legal system and includes:
    - Croatian law codes (KZ, ZKP, ZSZD, Ustav RH)
    - Croatian court hierarchy (Općinski sud, Županijski sud, Vrhovni sud)
    - Croatian legal procedures (žalba, zaštita zakonitosti, ustavna tužba)
  version: 1.0.0
  contact:
    name: API Support
    email: support@legal-ai.example.com
  license:
    name: Proprietary
    url: https://legal-ai.example.com/license

servers:
  - url: https://api.legal-ai.example.com/api
    description: Production server
  - url: https://staging-api.legal-ai.example.com/api
    description: Staging server
  - url: http://localhost:8000/api
    description: Local development server

tags:
  - name: OpenAI Proxy
    description: OpenAI API proxy endpoints with Croatian legal context
  - name: Content Ingestion
    description: Legal document ingestion and indexing
  - name: File Uploads
    description: File upload endpoints with chunked upload support
  - name: MCP Tools
    description: Model Context Protocol (MCP) tools for legal research
  - name: MCP-OpenAI Bridge
    description: MCP tools exposed as OpenAI function calling endpoints
  - name: Agent
    description: Autonomous research agent endpoints
  - name: Odluke Agent
    description: Court decision discovery agent
  - name: Search
    description: Unified legal document search across all corpora
  - name: Reasoning
    description: Legal reasoning engine for conflict resolution and logic
  - name: Analytics
    description: Predictive analytics for case outcomes and impact
  - name: Strategy
    description: Legal strategy building and argument generation
  - name: Misconduct
    description: Prosecutorial misconduct detection and legal actions
  - name: Topics
    description: Topic-based abuse analysis (drug charges, home searches, etc.)
  - name: Collaboration
    description: Multi-agent collaboration for complex legal problems
  - name: Monitoring
    description: Agent monitoring, health checks, and performance metrics
  - name: Graph
    description: Neo4j graph visualization and citation network analysis
  - name: Honeypot
    description: Security honeypot endpoints for detecting attackers

security:
  - BearerAuth: []
  - McpToken: []

paths:
  # OpenAI Proxy Endpoints
  /openai/responses:
    post:
      tags: [OpenAI Proxy]
      summary: Generate text responses via OpenAI
      description: Proxy endpoint for OpenAI completions API
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /openai/chat:
    post:
      tags: [OpenAI Proxy]
      summary: Chat completions
      description: OpenAI chat completions API with function calling support
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /openai/embeddings:
    post:
      tags: [OpenAI Proxy]
      summary: Generate embeddings
      description: Create vector embeddings for text using OpenAI
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Embedding vectors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /openai/image:
    post:
      tags: [OpenAI Proxy]
      summary: Generate images
      description: DALL-E image generation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: Image generation prompt
                n:
                  type: integer
                  default: 1
                size:
                  type: string
                  enum: ['256x256', '512x512', '1024x1024']
                  default: '1024x1024'
      responses:
        '200':
          description: Generated image URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string

  /openai/tts:
    post:
      tags: [OpenAI Proxy]
      summary: Text to speech
      description: Convert text to speech using OpenAI TTS
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  type: string
                model:
                  type: string
                  default: tts-1
                voice:
                  type: string
                  enum: [alloy, echo, fable, onyx, nova, shimmer]
      responses:
        '200':
          description: Audio file
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary

  /openai/transcribe:
    post:
      tags: [OpenAI Proxy]
      summary: Transcribe audio
      description: Speech to text using Whisper
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                  default: whisper-1
                language:
                  type: string
                  description: ISO-639-1 language code
      responses:
        '200':
          description: Transcription text
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string

  /openai/files:
    post:
      tags: [OpenAI Proxy]
      summary: Upload file to OpenAI
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [fine-tune, assistants]
      responses:
        '200':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
    get:
      tags: [OpenAI Proxy]
      summary: List uploaded files
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FileObject'

  /openai/files/{fileId}:
    delete:
      tags: [OpenAI Proxy]
      summary: Delete file
      security:
        - BearerAuth: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean

  /openai/assistants:
    post:
      tags: [OpenAI Proxy]
      summary: Create assistant
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantCreate'
      responses:
        '200':
          description: Assistant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assistant'
    get:
      tags: [OpenAI Proxy]
      summary: List assistants
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of assistants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assistant'

  /openai/assistants/{assistantId}:
    get:
      tags: [OpenAI Proxy]
      summary: Retrieve assistant
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssistantId'
      responses:
        '200':
          description: Assistant details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assistant'
    delete:
      tags: [OpenAI Proxy]
      summary: Delete assistant
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AssistantId'
      responses:
        '200':
          description: Assistant deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean

  /openai/vector-stores:
    post:
      tags: [OpenAI Proxy]
      summary: Create vector store
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Vector store created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorStore'
    get:
      tags: [OpenAI Proxy]
      summary: List vector stores
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of vector stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VectorStore'

  /openai/vector-stores/{storeId}:
    get:
      tags: [OpenAI Proxy]
      summary: Retrieve vector store
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VectorStoreId'
      responses:
        '200':
          description: Vector store details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorStore'
    delete:
      tags: [OpenAI Proxy]
      summary: Delete vector store
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VectorStoreId'
      responses:
        '200':
          description: Vector store deleted

  /openai/vector-stores/{storeId}/files:
    post:
      tags: [OpenAI Proxy]
      summary: Add file to vector store
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VectorStoreId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id:
                  type: string
      responses:
        '200':
          description: File added to vector store
    get:
      tags: [OpenAI Proxy]
      summary: List vector store files
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VectorStoreId'
      responses:
        '200':
          description: List of files in vector store

  /openai/vector-stores/{storeId}/files/{fileId}:
    delete:
      tags: [OpenAI Proxy]
      summary: Remove file from vector store
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VectorStoreId'
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File removed from vector store

  # Content Ingestion Endpoints
  /ingest/text:
    post:
      tags: [Content Ingestion]
      summary: Ingest text content
      description: Index text content for search and retrieval
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestTextRequest'
      responses:
        '200':
          description: Content ingested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /ingest/file:
    post:
      tags: [Content Ingestion]
      summary: Ingest file
      description: Upload and index a file (PDF, DOCX, TXT)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  type: string
                  description: JSON metadata
      responses:
        '200':
          description: File ingested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'

  /ingest/search:
    post:
      tags: [Content Ingestion]
      summary: Search ingested content
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /ingest/laws:
    post:
      tags: [Content Ingestion]
      summary: Ingest Croatian laws
      description: Bulk ingest Croatian legal documents with metadata
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [laws]
              properties:
                laws:
                  type: array
                  items:
                    $ref: '#/components/schemas/LawDocument'
      responses:
        '200':
          description: Laws ingested successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingested:
                    type: integer
                  failed:
                    type: integer

  # File Upload Endpoints
  /uploads:
    post:
      tags: [File Uploads]
      summary: Direct file upload
      description: Upload a file directly (for files < 10MB)
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'

  /uploads/start:
    post:
      tags: [File Uploads]
      summary: Start chunked upload
      description: Initialize a chunked upload for large files
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [filename, total_chunks]
              properties:
                filename:
                  type: string
                total_chunks:
                  type: integer
                file_size:
                  type: integer
      responses:
        '200':
          description: Upload session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_id:
                    type: string
                  expires_at:
                    type: string
                    format: date-time

  /uploads/{uploadId}/chunk/{index}:
    post:
      tags: [File Uploads]
      summary: Upload file chunk
      description: Upload a single chunk of a large file
      security:
        - BearerAuth: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Chunk uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  chunk_index:
                    type: integer
                  received:
                    type: boolean

  /uploads/{uploadId}/complete:
    post:
      tags: [File Uploads]
      summary: Complete chunked upload
      description: Finalize and merge all uploaded chunks
      security:
        - BearerAuth: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'

  /uploads/{uploadId}:
    delete:
      tags: [File Uploads]
      summary: Cancel upload
      description: Cancel and cleanup an in-progress upload
      security:
        - BearerAuth: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload cancelled

  # MCP Tools Endpoints
  /mcp/law.search:
    post:
      tags: [MCP Tools]
      summary: Search Croatian laws
      description: |
        Search for Croatian legal articles and provisions.
        Supports semantic search and citation-aware retrieval.
      security:
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LawSearchRequest'
      responses:
        '200':
          description: Law search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LawSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /mcp/law.get_article:
    post:
      tags: [MCP Tools]
      summary: Get specific law article
      description: Retrieve a specific article from a Croatian law
      security:
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [law_code, article_number]
              properties:
                law_code:
                  type: string
                  description: Law code (e.g., KZ, ZKP, ZSZD)
                  example: KZ
                article_number:
                  type: string
                  description: Article number
                  example: "123"
      responses:
        '200':
          description: Article content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LawArticle'

  /mcp/decision.search:
    post:
      tags: [MCP Tools]
      summary: Search court decisions
      description: Search Croatian court decisions and precedents
      security:
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionSearchRequest'
      responses:
        '200':
          description: Decision search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionSearchResponse'

  /mcp/decision.get:
    post:
      tags: [MCP Tools]
      summary: Get specific court decision
      description: Retrieve a specific court decision by ID
      security:
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision_id]
              properties:
                decision_id:
                  type: string
      responses:
        '200':
          description: Decision details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourtDecision'

  /mcp/case.search:
    post:
      tags: [MCP Tools]
      summary: Search private cases
      description: Search user's private cases (requires authentication)
      security:
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseSearchRequest'
      responses:
        '200':
          description: Case search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSearchResponse'

  # MCP-OpenAI Bridge Endpoints
  /mcp-openai/info:
    get:
      tags: [MCP-OpenAI Bridge]
      summary: Get bridge info
      description: Public endpoint with bridge version and capabilities
      security: []
      responses:
        '200':
          description: Bridge information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  mcp_version:
                    type: string
                  openai_version:
                    type: string

  /mcp-openai/tools:
    get:
      tags: [MCP-OpenAI Bridge]
      summary: List available MCP tools
      description: Get list of MCP tools formatted for OpenAI function calling
      security:
        - McpToken: []
      responses:
        '200':
          description: List of tools
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenAIFunction'

  /mcp-openai/tools/execute:
    post:
      tags: [MCP-OpenAI Bridge]
      summary: Execute MCP tool
      description: Execute an MCP tool with given arguments
      security:
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tool_name, arguments]
              properties:
                tool_name:
                  type: string
                arguments:
                  type: object
      responses:
        '200':
          description: Tool execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                  metadata:
                    type: object

  /mcp-openai/chat/completions:
    post:
      tags: [MCP-OpenAI Bridge]
      summary: Chat completions with MCP tools
      description: OpenAI-compatible chat completions with automatic MCP tools injection
      security:
        - McpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Chat completion with tool calls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'

  /mcp-openai/webhook:
    post:
      tags: [MCP-OpenAI Bridge]
      summary: OpenAI webhook callback
      description: Webhook endpoint for OpenAI function calling callbacks
      security:
        - McpToken: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed

  # Agent Endpoints
  /agent/research/start:
    post:
      tags: [Agent]
      summary: Start research run
      description: Start autonomous research agent on a legal question
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Legal research question
                options:
                  type: object
                  properties:
                    max_depth:
                      type: integer
                      default: 3
                    include_precedents:
                      type: boolean
                      default: true
      responses:
        '200':
          description: Research started
          content:
            application/json:
              schema:
                type: object
                properties:
                  research_id:
                    type: string
                  status:
                    type: string
                  started_at:
                    type: string
                    format: date-time

  /agent/research:
    get:
      tags: [Agent]
      summary: List research runs
      description: Get list of all research runs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of research runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResearchRun'

  /agent/research/{id}:
    get:
      tags: [Agent]
      summary: Get research run details
      description: Get detailed results of a research run
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Research run details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchRun'
    delete:
      tags: [Agent]
      summary: Delete research run
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Research run deleted

  /agent/research/{id}/evaluation:
    get:
      tags: [Agent]
      summary: Get research evaluation
      description: Get quality evaluation of research results
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
