        '200':
          description: Collaboration started
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaboration_id:
                    type: string
                  status:
                    type: string
                  agents:
                    type: array
                    items:
                      type: string

  /collaboration/{id}:
    get:
      tags: [Collaboration]
      summary: Get collaboration details
      description: Get full collaboration results with agent contributions
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Collaboration details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collaboration'

  /collaboration/recent:
    get:
      tags: [Collaboration]
      summary: Get recent collaborations
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Recent collaborations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collaboration'

  /collaboration/stats:
    get:
      tags: [Collaboration]
      summary: Get collaboration statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Collaboration statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_collaborations:
                    type: integer
                  successful_rate:
                    type: number
                  avg_duration:
                    type: number

  # Monitoring Endpoints
  /monitoring/health:
    get:
      tags: [Monitoring]
      summary: System health check
      description: Get system health with failure rate analysis
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, degraded, unhealthy]
                  agents:
                    type: object
                  queues:
                    type: object
                  databases:
                    type: object

  /monitoring/statistics:
    get:
      tags: [Monitoring]
      summary: Get agent statistics
      description: Statistics for research agent and decision discovery
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Agent statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  research_agent:
                    type: object
                  decision_discovery:
                    type: object

  /monitoring/recent-runs:
    get:
      tags: [Monitoring]
      summary: Get recent agent runs
      description: Recent run history for all agents
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Recent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    agent_type:
                      type: string
                    status:
                      type: string
                    started_at:
                      type: string
                      format: date-time
                    completed_at:
                      type: string
                      format: date-time

  /monitoring/failed-jobs:
    get:
      tags: [Monitoring]
      summary: Get failed jobs
      description: Failed jobs for debugging
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Failed jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    exception:
                      type: string
                    failed_at:
                      type: string
                      format: date-time

  # Graph Visualization Endpoints
  /graph/visualize/{nodeId}:
    get:
      tags: [Graph]
      summary: Visualize node with neighbors
      description: Get node with citation network for visualization
      security:
        - BearerAuth: []
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
        - name: depth
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
            maximum: 3
      responses:
        '200':
          description: Graph data for visualization
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                  edges:
                    type: array
                    items:
                      type: object

  /graph/subgraph:
    post:
      tags: [Graph]
      summary: Get filtered subgraph
      description: Extract subgraph by node type and properties
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                node_types:
                  type: array
                  items:
                    type: string
                filters:
                  type: object
      responses:
        '200':
          description: Subgraph data
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                  edges:
                    type: array

  /graph/stats:
    get:
      tags: [Graph]
      summary: Get graph statistics
      description: Node and relationship counts, graph topology metrics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Graph statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_count:
                    type: integer
                  relationship_count:
                    type: integer
                  node_types:
                    type: object
                  relationship_types:
                    type: object

  # Honeypot Endpoints
  /admin/login:
    post:
      tags: [Honeypot]
      summary: Fake admin login (honeypot)
      description: Honeypot endpoint - logs attacker attempts
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '401':
          description: Unauthorized (fake response)

  /admin/users:
    get:
      tags: [Honeypot]
      summary: Fake admin users endpoint (honeypot)
      security: []
      responses:
        '403':
          description: Forbidden (fake response)

  /.env:
    get:
      tags: [Honeypot]
      summary: Fake env file (honeypot)
      description: Honeypot for attackers looking for .env files
      security: []
      responses:
        '404':
          description: Not found (fake response)

  /phpinfo:
    get:
      tags: [Honeypot]
      summary: Fake phpinfo (honeypot)
      security: []
      responses:
        '403':
          description: Forbidden (fake response)

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API token authentication via Authorization header

    McpToken:
      type: apiKey
      in: header
      name: X-MCP-Token
      description: MCP-specific authentication token

  parameters:
    CaseId:
      name: caseId
      in: path
      required: true
      description: Unique case identifier
      schema:
        type: string

    AssistantId:
      name: assistantId
      in: path
      required: true
      description: OpenAI assistant ID
      schema:
        type: string

    VectorStoreId:
      name: storeId
      in: path
      required: true
      description: Vector store ID
      schema:
        type: string

  responses:
    Unauthorized:
      description: Unauthorized - Invalid or missing API token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Unauthorized

    TooManyRequests:
      description: Too many requests - Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Too many requests
              retry_after:
                type: integer
                description: Seconds to wait before retry

  schemas:
    # OpenAI Schemas
    OpenAIRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        model:
          type: string
          default: gpt-4
        max_tokens:
          type: integer
        temperature:
          type: number
          format: float

    OpenAIResponse:
      type: object
      properties:
        id:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              index:
                type: integer

    ChatCompletionRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [system, user, assistant, function]
              content:
                type: string
              name:
                type: string
        model:
          type: string
          default: gpt-4
        functions:
          type: array
          items:
            $ref: '#/components/schemas/OpenAIFunction'
        temperature:
          type: number
        max_tokens:
          type: integer

    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
                  function_call:
                    type: object
              finish_reason:
                type: string

    EmbeddingRequest:
      type: object
      required: [input]
      properties:
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        model:
          type: string
          default: text-embedding-ada-002

    EmbeddingResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              embedding:
                type: array
                items:
                  type: number
              index:
                type: integer

    FileObject:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        bytes:
          type: integer
        created_at:
          type: integer
        filename:
          type: string
        purpose:
          type: string

    Assistant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        model:
          type: string
        instructions:
          type: string
        tools:
          type: array
        file_ids:
          type: array
          items:
            type: string

    AssistantCreate:
      type: object
      required: [model]
      properties:
        model:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        tools:
          type: array

    VectorStore:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: integer
        file_counts:
          type: object

    OpenAIFunction:
      type: object
      required: [name, description, parameters]
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object

    # Ingestion Schemas
    IngestTextRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        metadata:
          type: object
        corpus:
          type: string
          enum: [laws, decisions, cases]

    IngestResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        chunks_created:
          type: integer

    LawDocument:
      type: object
      required: [doc_id, title, content]
      properties:
        doc_id:
          type: string
          description: Document identifier (e.g., nn-2021-12-1234)
        title:
          type: string
        content:
          type: string
        law_code:
          type: string
          description: Law code (e.g., KZ, ZKP, ZSZD)
        law_number:
          type: string
        metadata:
          type: object

    # Upload Schemas
    UploadResponse:
      type: object
      properties:
        file_id:
          type: string
        filename:
          type: string
        size:
          type: integer
        mime_type:
          type: string
        url:
          type: string

    # Search Schemas
    SearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        limit:
          type: integer
          default: 10
        filters:
          type: object
        include_embeddings:
          type: boolean
          default: false

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              score:
                type: number
              content:
                type: string
              metadata:
                type: object
        total:
          type: integer
        query_time:
          type: number

    UnifiedSearchRequest:
      allOf:
        - $ref: '#/components/schemas/SearchRequest'
        - type: object
          properties:
            corpora:
              type: array
              items:
                type: string
                enum: [laws, decisions, cases]
              default: [laws, decisions]

    UnifiedSearchResponse:
      type: object
      properties:
        laws:
          type: array
        decisions:
          type: array
        cases:
          type: array
        total:
          type: integer

    CitationSearchResponse:
      allOf:
        - $ref: '#/components/schemas/SearchResponse'
        - type: object
          properties:
            citations:
              type: object
              properties:
                citing:
                  type: array
                cited_by:
                  type: array

    # MCP Tool Schemas
    LawSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        law_codes:
          type: array
          items:
            type: string
          description: Filter by law codes (KZ, ZKP, etc.)
        limit:
          type: integer
          default: 10

    LawSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/LawArticle'
        total:
          type: integer

    LawArticle:
      type: object
      properties:
        doc_id:
          type: string
        law_code:
          type: string
        article_number:
          type: string
        title:
          type: string
        content:
          type: string
        metadata:
          type: object

    DecisionSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        court:
          type: string
          description: Filter by court name
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        limit:
          type: integer
          default: 10

    DecisionSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/CourtDecision'
        total:
          type: integer

    CourtDecision:
      type: object
      properties:
        id:
          type: string
        case_number:
          type: string
        court:
          type: string
        date:
          type: string
          format: date
        summary:
          type: string
        full_text:
          type: string
        citations:
          type: array
          items:
            type: string

    CaseSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
        status:
          type: string
          enum: [open, closed, appealed]
        limit:
          type: integer
          default: 10

    CaseSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
        total:
          type: integer

    # Analytics Schemas
    OutcomePrediction:
      type: object
      properties:
        case_id:
          type: string
        predicted_outcome:
          type: string
          enum: [acquittal, conviction, dismissal, settlement]
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        factors:
          type: array
          items:
            type: object
            properties:
              factor:
                type: string
              impact:
                type: number

    # Strategy Schemas
    LegalStrategy:
      type: object
      properties:
        case_id:
          type: string
        primary_arguments:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string
        recommended_actions:
          type: array
          items:
            type: string

    LegalArgument:
      type: object
      properties:
        type:
          type: string
          enum: [statutory, constitutional, precedential]
        issue:
          type: string
          description: IRAC - Issue
        rule:
          type: string
          description: IRAC - Rule
        application:
          type: string
          description: IRAC - Application
        conclusion:
          type: string
          description: IRAC - Conclusion
        supporting_citations:
          type: array
          items:
            type: string

    RiskAssessment:
      type: object
      properties:
        overall_risk:
          type: string
          enum: [low, medium, high, critical]
        risk_factors:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              severity:
                type: integer
              description:
                type: string
              mitigation:
                type: string

    # Misconduct Schemas
    MisconductAnalysis:
      type: object
      properties:
        case_id:
          type: string
        misconduct_found:
          type: boolean
        types:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [witness_tampering, evidence_suppression, false_statements, improper_arguments, selective_prosecution, conflict_of_interest]
              severity:
                type: integer
                minimum: 0
                maximum: 100
              description:
                type: string
              evidence:
                type: array
                items:
                  type: string
        overall_severity:
          type: integer
        patterns:
          type: array

    # Topics Schemas
    TopicAnalysis:
      type: object
      properties:
        topic_id:
          type: string
        case_id:
          type: string
        abuse_detected:
          type: boolean
        severity:
          type: integer
        details:
          type: object

    TopicStatistics:
      type: object
      properties:
        topic_id:
          type: string
        total_cases:
          type: integer
        abuse_rate:
          type: number
        by_court:
          type: object
        by_period:
          type: object

    RegionalStatistics:
      type: object
      properties:
        region:
          type: string
        case_count:
          type: integer
        abuse_rate:
          type: number
        avg_severity:
          type: number

    # Collaboration Schemas
    Collaboration:
      type: object
      properties:
        id:
          type: string
        problem:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed, failed]
        agents:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              status:
                type: string
              contribution:
                type: string
        final_solution:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    # Reasoning Schemas
    ConflictAnalysis:
      type: object
      properties:
        conflicts:
          type: array
          items:
            type: object
            properties:
              provision_a:
                type: string
              provision_b:
                type: string
              conflict_type:
                type: string
              description:
                type: string

    ConflictResolution:
      type: object
      properties:
        conflict_id:
          type: string
        resolution_rule:
          type: string
          enum: [lex_superior, lex_specialis, lex_posterior]
        prevailing_provision:
          type: string
        explanation:
          type: string

    # Research Schemas
    ResearchRun:
      type: object
      properties:
        id:
          type: string
        query:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        findings:
          type: array
          items:
            type: object
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
