  # Agent Insights Endpoints
  /insights/{agentName}:
    get:
      tags: [Agent]
      summary: Get agent insights
      description: |
        Retrieve stored insights from past agent research runs, enabling memory reuse
        and knowledge continuity across autonomous agent executions.

        Insights are filtered by agent name and can be further refined by objective,
        namespace, source, time range, and result limit.
      security:
        - BearerAuth: []
      parameters:
        - name: agentName
          in: path
          required: true
          description: Name of the agent (lowercase letters, numbers, underscores only)
          schema:
            type: string
            pattern: '^[a-z0-9_]+$'
            example: autonomous_research_agent
        - name: objective
          in: query
          required: false
          description: Filter by research objective (partial match, min 3 chars)
          schema:
            type: string
            minLength: 3
            example: Croatian labor law
        - name: namespace
          in: query
          required: false
          description: Filter by memory namespace
          schema:
            type: string
            maxLength: 100
            default: research_insights
            example: research_insights
        - name: source
          in: query
          required: false
          description: Filter by source reference
          schema:
            type: string
            maxLength: 100
            example: autonomous_research
        - name: limit
          in: query
          required: false
          description: Maximum number of insights to return (1-100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 20
        - name: days
          in: query
          required: false
          description: Only include insights from last N days (0-365)
          schema:
            type: integer
            minimum: 0
            maximum: 365
            default: 30
            example: 60
      responses:
        '200':
          description: Successfully retrieved insights
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  agent_name:
                    type: string
                    example: autonomous_research_agent
                  filters:
                    type: object
                    properties:
                      namespace:
                        type: string
                        example: research_insights
                      limit:
                        type: integer
                        example: 10
                      days:
                        type: integer
                        example: 30
                      objective:
                        type: string
                        example: Croatian labor law
                      source:
                        type: string
                        example: autonomous_research
                  insights:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ULID of the insight
                          example: 01HQTEST123456789
                        content:
                          type: string
                          description: The insight content
                          example: Article 93 of Croatian Labor Law requires 2 weeks notice
                        objective:
                          type: string
                          description: Research objective this insight relates to
                          example: Research Croatian labor law termination procedures
                        metadata:
                          type: object
                          description: Additional metadata about the insight
                          example:
                            run_id: run-123
                            objective: Research Croatian labor law termination procedures
                        source:
                          type: string
                          description: Source of the insight
                          example: autonomous_research
                        source_id:
                          type: string
                          description: ID of the source (e.g., run ID)
                          example: run-123
                        created_at:
                          type: string
                          format: date-time
                          description: When the insight was created
                          example: 2025-10-15T10:00:00Z
                  count:
                    type: integer
                    description: Number of insights returned
                    example: 2
                  message:
                    type: string
                    description: Optional message about the results
                    example: Successfully retrieved 2 recent insights
        '400':
          description: Invalid agent name format
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: VALIDATION_ERROR
                  message:
                    type: string
                    example: Invalid agent name format
                  data:
                    type: object
                    properties:
                      agent_name:
                        type: string
                        example: Agent name must contain only lowercase letters, numbers, and underscores
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The objective field must be at least 3 characters.
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  code:
                    type: string
                    example: AGENT_EXECUTION_FAILED
                  message:
                    type: string
                    example: Failed to retrieve insights
                  data:
                    type: object
                    properties:
                      error:
                        type: string
                        example: Database connection failed

